# XcodeGen spec — the .xcodeproj is generated from this file and is not checked in.
#   brew install xcodegen && xcodegen generate && open PetHealthMemory.xcodeproj
name: PetHealthMemory

options:
  bundleIdPrefix: com.pethealthmemory
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Pinned until the code is migrated to Swift 6 strict concurrency.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    SWIFT_APPROACHABLE_CONCURRENCY: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  PetHealthMemory:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: PetHealthMemory
        excludes:
          - "Tests/**"
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pethealthmemory.app
        PRODUCT_NAME: Pet Health Memory
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pet Health Memory
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.medical
        INFOPLIST_KEY_NSCameraUsageDescription: Scan vet documents. Scans stay on this device.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # macOS: App Sandbox with read-only access to files the user picks or drops.
        "ENABLE_APP_SANDBOX[sdk=macosx*]": YES
        "ENABLE_USER_SELECTED_FILES[sdk=macosx*]": readonly
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        CODE_SIGN_STYLE: Automatic
    scheme: {}
