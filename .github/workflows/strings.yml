name: Strings

# Exports every user-facing string (as Xcode extracts them) and checks that each one is
# translated for the shipping languages. The exported .xcloc bundles are uploaded so new keys
# can be translated into PetHealthMemory/Resources/Localizable.xcstrings.
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen && xcodegen generate
      - name: Export localizations (iOS and macOS sources)
        run: |
          for sdk in iphonesimulator macosx; do
            xcodebuild -exportLocalizations -project PetHealthMemory.xcodeproj \
              -localizationPath "loc/$sdk" -exportLanguage de -exportLanguage fr -exportLanguage ja \
              -sdk "$sdk" CODE_SIGNING_ALLOWED=NO 2>&1 | tail -5
          done
          fd -e xliff . loc || find loc -name '*.xliff'
      - name: Check translations
        run: python3 scripts/check_strings.py loc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: localizations
          path: loc/
