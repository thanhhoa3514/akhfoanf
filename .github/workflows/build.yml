name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS Simulator
            destination: generic/platform=iOS Simulator
          - name: macOS
            destination: generic/platform=macOS
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project PetHealthMemory.xcodeproj \
            -scheme PetHealthMemory \
            -configuration Debug \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.name == 'macOS' && 'macos' || 'ios' }}
          path: build.log
          retention-days: 7

  ui-snapshots:
    name: UI snapshots (${{ matrix.name }})
    needs: build
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone
            platform: ios
            artifact: ui-snapshots-iphone
          - name: macOS
            platform: macos
            artifact: ui-snapshots-macos
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick and prepare an iPhone simulator
        if: matrix.platform == 'ios'
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone [0-9]+$"))] | last | .udid')
          xcrun simctl list devices available | grep "$udid"
          xcrun simctl boot "$udid" || true
          # Skip the one-time keyboard tips that would cover the screenshots.
          xcrun simctl spawn "$udid" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true
          xcrun simctl spawn "$udid" defaults write com.apple.keyboard.preferences DidShowGestureKeyboardIntroduction -bool true
          xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          echo "DESTINATION=id=$udid" >> "$GITHUB_ENV"
          echo "SIGNING=CODE_SIGNING_ALLOWED=NO" >> "$GITHUB_ENV"

      - name: Prepare macOS destination
        if: matrix.platform == 'macos'
        run: |
          # The runner's display defaults to 1024x768 at 1x, which makes screenshots blurry
          # and squeezes the 3-column window. Switch to the largest HiDPI (scaling:on) mode
          # if the virtual display offers one, otherwise the largest mode.
          brew install jakehilborn/jakehilborn/displayplacer || true
          if command -v displayplacer >/dev/null; then
            displayplacer list | tee displays.txt | grep -E "mode [0-9]+:" | head -40 || true
            python3 - <<'PY' > display_cmd.txt || true
          import re
          text = open("displays.txt").read()
          sid = re.search(r"Persistent screen id: (\S+)", text).group(1)
          modes = [(int(m.group(1)), int(m.group(2)), int(m.group(3)), "scaling:on" in m.group(0))
                   for m in re.finditer(r"mode (\d+): res:(\d+)x(\d+)[^\n]*", text)]
          hidpi = [m for m in modes if m[3] and m[1] >= 1280]
          pick = max(hidpi or modes, key=lambda m: (m[1] * m[2]) if not hidpi else -abs(m[1] - 1440))
          print(f"id:{sid} mode:{pick[0]}")
          PY
            echo "Switching display: $(cat display_cmd.txt)"
            displayplacer "$(cat display_cmd.txt)" || true
            sleep 3
            displayplacer list | grep -E "current mode" || true
          fi

          echo "DESTINATION=platform=macOS" >> "$GITHUB_ENV"
          # macOS UI tests need a signed runner: ad-hoc sign, no team, no hardened runtime.
          echo "SIGNING=CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= ENABLE_HARDENED_RUNTIME=NO" >> "$GITHUB_ENV"

      - name: Run UI tests
        run: |
          xcodebuild test \
            -project PetHealthMemory.xcodeproj \
            -scheme PetHealthMemory \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -resultBundlePath Snapshots.xcresult \
            -skip-testing:PetHealthMemoryUITests/AppStoreScreenshots \
            $SIGNING \
            2>&1 | tee test.log | grep -E "error:|Test Case .*(passed|failed)|TEST (SUCCEEDED|FAILED)|\*\* TEST" || true
          grep -q "TEST SUCCEEDED" test.log

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p snapshots
          if [ -d Snapshots.xcresult ]; then
            xcrun xcresulttool export attachments --path Snapshots.xcresult --output-path snapshots || true
          fi
          ls -la snapshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            snapshots/
            test.log
          retention-days: 14
