name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS Simulator
            destination: generic/platform=iOS Simulator
          - name: macOS
            destination: generic/platform=macOS
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project PetHealthMemory.xcodeproj \
            -scheme PetHealthMemory \
            -configuration Debug \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.name == 'macOS' && 'macos' || 'ios' }}
          path: build.log
          retention-days: 7

  ui-snapshots:
    name: UI snapshots (iPhone)
    needs: build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone [0-9]+$"))] | last | .udid')
          echo "Using simulator $udid"
          xcrun simctl list devices available | grep "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Prepare simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          # Skip the one-time keyboard tips that would cover the screenshots.
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" defaults write com.apple.keyboard.preferences DidShowGestureKeyboardIntroduction -bool true
          xcrun simctl status_bar "${{ steps.sim.outputs.udid }}" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true

      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project PetHealthMemory.xcodeproj \
            -scheme PetHealthMemory \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath Snapshots.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log | grep -E "error:|Test Case .*(passed|failed)|TEST (SUCCEEDED|FAILED)|\*\* TEST" || true
          grep -q "TEST SUCCEEDED" test.log

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p snapshots
          if [ -d Snapshots.xcresult ]; then
            xcrun xcresulttool export attachments --path Snapshots.xcresult --output-path snapshots || true
          fi
          ls -la snapshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: |
            snapshots/
            test.log
          retention-days: 14
