name: App Store screenshots

# Run by hand (Actions ▸ App Store screenshots ▸ Run workflow) before a submission, or when the
# App Store test / caption script changes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "PetHealthMemory/Tests/UITests/AppStoreScreenshots.swift"
      - "scripts/appstore_frames.py"
      - ".github/workflows/appstore.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone 6.9-inch (+ 6.5-inch)
            device: iphone
            simulator: '^iPhone [0-9]+ Pro Max$'
          - name: iPad 13-inch
            device: ipad
            simulator: '^iPad Pro 13-inch'
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: |
          brew install xcodegen
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Boot simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r --arg re '${{ matrix.simulator }}' '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test($re))] | last | .udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "No simulator matches ${{ matrix.simulator }}"; xcrun simctl list devices available; exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl spawn "$udid" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true
          xcrun simctl status_bar "$udid" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          echo "UDID=$udid" >> "$GITHUB_ENV"

      - name: Capture screenshots
        run: |
          xcodebuild test \
            -project PetHealthMemory.xcodeproj \
            -scheme PetHealthMemory \
            -destination "id=$UDID" \
            -derivedDataPath DerivedData \
            -resultBundlePath AppStore.xcresult \
            -only-testing:PetHealthMemoryUITests/AppStoreScreenshots \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log | grep -E "error:|Test Case .*(passed|failed)|\*\* TEST" || true
          grep -q "TEST SUCCEEDED" test.log

      - name: Export and frame
        if: always()
        run: |
          mkdir -p raw appstore
          xcrun xcresulttool export attachments --path AppStore.xcresult --output-path raw || true
          python3 scripts/appstore_frames.py --input raw --output appstore --device ${{ matrix.device }}

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appstore-${{ matrix.device }}
          path: |
            appstore/
            test.log
          retention-days: 30
