name: App Store screenshots

# Run by hand (Actions ▸ App Store screenshots ▸ Run workflow) before a submission, or when the
# App Store test / caption script changes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "PetHealthMemory/Tests/UITests/AppStoreScreenshots.swift"
      - "scripts/appstore_frames.py"
      - ".github/workflows/appstore.yml"
      - "PetHealthMemory/App/SampleCopy.swift"
      - "PetHealthMemory/Resources/Localizable.xcstrings"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone 6.9-inch (+ 6.5-inch)
            device: iphone
            simulator: '^iPhone [0-9]+ Pro Max$'
          - name: iPad 13-inch
            device: ipad
            simulator: '^iPad Pro 13-inch'
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: |
          brew install xcodegen
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Boot simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r --arg re '${{ matrix.simulator }}' '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test($re))] | last | .udid')
          if [ -z "$udid" ] || [ "$udid" = "null" ]; then
            echo "No simulator matches ${{ matrix.simulator }}"; xcrun simctl list devices available; exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl spawn "$udid" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true
          xcrun simctl status_bar "$udid" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          echo "UDID=$udid" >> "$GITHUB_ENV"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project PetHealthMemory.xcodeproj -scheme PetHealthMemory \
            -destination "id=$UDID" -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -3

      # One run per store language on the same simulator. The test reads APPSTORE_LANG
      # (xcodebuild passes TEST_RUNNER_* variables to the runner without the prefix).
      - name: Capture and frame (en, de, fr, ja)
        run: |
          failed=0
          for lang in en de fr ja; do
            echo "::group::$lang"
            TEST_RUNNER_APPSTORE_LANG=$lang xcodebuild test-without-building \
              -project PetHealthMemory.xcodeproj -scheme PetHealthMemory \
              -destination "id=$UDID" -derivedDataPath DerivedData \
              -resultBundlePath "AppStore-$lang.xcresult" \
              -only-testing:PetHealthMemoryUITests/AppStoreScreenshots \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee "test-$lang.log" | grep -E "error:|Test Case .*(passed|failed)|\*\* TEST" || true
            grep -q "TEST.* SUCCEEDED" "test-$lang.log" || { echo "::error::$lang test failed"; failed=1; }
            mkdir -p "raw/$lang"
            xcrun xcresulttool export attachments --path "AppStore-$lang.xcresult" --output-path "raw/$lang" || true
            python3 scripts/appstore_frames.py --input "raw/$lang" --output "out/$lang" \
              --device ${{ matrix.device }} --lang $lang || failed=1
            echo "::endgroup::"
          done
          exit $failed

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appstore-${{ matrix.device }}
          path: |
            out/
            test-*.log
          retention-days: 30
